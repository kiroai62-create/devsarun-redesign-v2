; PHP limits for hosts running PHP-FPM / LiteSpeed (e.g. Hostinger), where .htaccess php_value is ignored.
; Lets the admin upload large PDF notes to the store. If uploads still fail, raise these in hPanel → PHP Configuration.
upload_max_filesize = 64M
post_max_size = 70M
max_execution_time = 180
memory_limit = 256M
expose_php = Off
